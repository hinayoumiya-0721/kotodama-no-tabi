name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (all JS)
        run: |
          set -e
          for f in *.js js/*.js data/questions/*.js tools/*.js tests/*.js; do
            node --check "$f"
          done

      - name: Question bank check (ids, options, answerIndex, ruby/span tags)
        run: node tools/validate-questions.js

      - name: Unit tests (save / SRS / drill / PWA precache list)
        run: node tests/save-and-srs.test.js
